[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nthlayer-core"
version = "3.0.0"
description = "NthLayer core — reliability-critical verdict store, case management, and HTTP API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Floor is the version this repo is built and tested against, NOT the
    # oldest one that happens to import. Guarded by
    # tests/test_dependency_declarations.py and
    # tests/smoke/test_resolved_dependencies.py; see CLAUDE.md
    # hard rule 10 for why both are needed [opensrm-p3bm].
    # 4.0.0 moved segments/stability/calibration/audit_backlog/feedback_latency
    # out of manifest.slos into manifest.judgment_thresholds [opensrm-l33e].
    # 5.0.0 gives segments a required `metric` (+ its parameter) and closes
    # every threshold entry [opensrm-7zpz]; catalogue.manifest_to_dict
    # serialises each threshold via threshold_to_v2_entry, common's validated
    # emitter of the v2 spec.judgment_threshold entry, never a hand-copy.
    # WHY 5.2.0 (opensrm-g35i): the version this repo is now built and tested
    # against (rule 10: the floor is the installed sibling). Nothing here uses
    # an API new in 5.1/5.2.
    "nthlayer-common>=5.2.0,<6.0.0",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.scripts]
nthlayer = "nthlayer_core.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    # Imported directly by the two dependency guards, so declared rather than
    # leaned on as pytest's transitive dep [opensrm-p3bm].
    "packaging>=22",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "openapi-spec-validator>=0.7",
    # Imported directly by tests/test_api_manifests.py.
    "jsonschema>=4.18",
    "ruff>=0.8",
]

[tool.uv.sources]
nthlayer-common = { path = "../nthlayer-common", editable = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nthlayer-core"
version = "1.8.0"
description = "NthLayer core — reliability-critical verdict store, case management, and HTTP API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Floor is the version this repo is built and tested against, NOT the
    # oldest one that happens to import. Guarded by
    # tests/test_dependency_declarations.py and tests/smoke/; see CLAUDE.md
    # hard rule 10 for why both are needed [opensrm-p3bm].
    "nthlayer-common>=2.1.2,<3.0.0",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.scripts]
nthlayer = "nthlayer_core.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    # Imported directly by the two dependency guards, so declared rather than
    # leaned on as pytest's transitive dep [opensrm-p3bm].
    "packaging>=22",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "openapi-spec-validator>=0.7",
    "ruff>=0.8",
]

[tool.uv.sources]
nthlayer-common = { path = "../nthlayer-common", editable = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
